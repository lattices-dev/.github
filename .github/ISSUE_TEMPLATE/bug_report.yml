name: Bug report
description: Report a reproducible problem.
body:
  - type: input
    id: environment
    attributes:
      label: Product and environment
      description: Product, version or commit, macOS version, and Bun or Node version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or action that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private screen content. Report vulnerabilities privately through the Security tab.
